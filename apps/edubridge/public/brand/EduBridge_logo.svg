<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- EduBridge: open book + pencil + circle (clear book silhouette) -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#7c3aed" stroke-width="14"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ede9fe" stroke-width="5"/>

  <!-- Open book: two curved pages -->
  <path
    fill="#f8fafc"
    d="M100 148
       C84 132 62 122 40 122
       C34 122 28 123 22 125
       L22 72
       C28 70 34 69 40 69
       C62 69 84 78 100 94
       L100 148 Z"
  />
  <path
    fill="#f8fafc"
    d="M100 148
       C116 132 138 122 160 122
       C166 122 172 123 178 125
       L178 72
       C172 70 166 69 160 69
       C138 69 116 78 100 94
       L100 148 Z"
  />
  <!-- Page lines -->
  <path fill="#cbd5e1" d="M44 84 L44 88 L84 96 L84 92 Z"/>
  <path fill="#cbd5e1" d="M44 100 L44 104 L84 112 L84 108 Z"/>
  <path fill="#cbd5e1" d="M156 84 L156 88 L116 96 L116 92 Z"/>
  <path fill="#cbd5e1" d="M156 100 L156 104 L116 112 L116 108 Z"/>
  <!-- Spine -->
  <rect x="96" y="88" width="8" height="64" rx="2" fill="#94a3b8"/>

  <!-- Pencil -->
  <g transform="rotate(-24 100 108)">
    <rect x="66" y="100" width="62" height="14" rx="7" fill="#f59e0b"/>
    <rect x="124" y="100" width="8" height="14" rx="2" fill="#94a3b8"/>
    <rect x="132" y="100" width="10" height="14" rx="3" fill="#f472b6"/>
    <path fill="#fde68a" d="M66 100 L50 107 L66 114 Z"/>
    <path fill="#0f172a" d="M56 104.5 L50 107 L56 109.5 Z"/>
  </g>

  <circle cx="100" cy="100" r="5" fill="#7c3aed"/>
</svg>
