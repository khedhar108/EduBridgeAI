<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Ring of Education — premium thumbnail mark -->
  <!-- Purple outer fence -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#5b21b6" stroke-width="10"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#7c3aed" stroke-width="8"/>

  <!-- Teal mid rings (trust / school) -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#0f766e" stroke-width="8"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#14b8a6" stroke-width="7"/>

  <!-- Soft inner light field -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#ccfbf1" stroke-width="6"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#ede9fe" stroke-width="5"/>

  <!-- Center: amber human-approve pulse (not red — red reads danger) -->
  <circle cx="100" cy="100" r="26" fill="#5b21b6"/>
  <circle cx="100" cy="100" r="16" fill="#0d9488"/>
  <circle cx="100" cy="100" r="8" fill="#fbbf24"/>

  <!-- Four knowledge nodes on the purple rim -->
  <circle cx="100" cy="22" r="5" fill="#a78bfa"/>
  <circle cx="100" cy="178" r="5" fill="#a78bfa"/>
  <circle cx="22" cy="100" r="5" fill="#5eead4"/>
  <circle cx="178" cy="100" r="5" fill="#5eead4"/>
</svg>
